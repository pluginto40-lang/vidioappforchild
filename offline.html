<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F1EE">
<title>우리 아이 맞춤 영상</title>
<style>
  body { margin: 0; background: #F2F1EE; color: #1C1B1A; text-align: center;
         font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .hero { height: 210px; }
  .hero svg { width: 100%; height: 100%; display: block; }
  main { max-width: 480px; margin: 0 auto; padding: 12px 20px 40px; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.6px; margin: 0 0 8px; }
  p { font-size: 15px; line-height: 1.5; color: #8A8782; margin: 0 0 28px; }
  button { width: 100%; max-width: 440px; padding: 18px; border: 0; border-radius: 999px;
           background: #1C1B1A; color: #fff; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="hero"><svg viewBox="0 0 400 210" preserveAspectRatio="xMidYMax slice">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#BFE0FA"/><stop offset="1" stop-color="#F2F1EE"/></linearGradient></defs>
  <rect width="400" height="210" fill="url(#sky)"/>
  <circle cx="318" cy="64" r="30" fill="#FFCB57"/>
  <g fill="#fff"><ellipse cx="96" cy="70" rx="36" ry="15"/><ellipse cx="118" cy="60" rx="22" ry="16"/></g>
  <path d="M0 170 C70 130 140 140 210 160 S330 150 400 130 V210 H0Z" fill="#A9DBA8"/>
  <path d="M0 190 C90 160 170 175 250 185 S360 175 400 168 V210 H0Z" fill="#7CC48B"/>
  <path d="M0 210 V200 C120 188 280 196 400 192 V210Z" fill="#F2F1EE"/>
</svg></div>
<main>
  <h1>인터넷 연결을 확인해 주세요</h1>
  <p>영상을 보려면 인터넷이 필요해요.<br>와이파이나 데이터가 켜져 있는지 확인한 뒤 다시 시도해 주세요.</p>
  <button onclick="location.reload()">다시 시도</button>
</main>
</body>
</html>
